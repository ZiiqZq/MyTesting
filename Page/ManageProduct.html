<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - ZoTrix</title>
    <link rel="stylesheet" href="../Assets/css/css.css" />
    <style>
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-content-lg {
            max-width: 1200px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6b7280;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Tab Styles */
        .tab-btn {
            color: #6b7280;
            border-color: transparent;
        }

        .tab-btn.active {
            color: #3b82f6;
            border-color: #3b82f6;
        }

        .tab-btn:hover {
            color: #1f2937;
        }

        .tab-content {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Table styles for template preview */
        .template-preview-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }

        .template-preview-table th {
            background: linear-gradient(to bottom, #4a6fa5, #3a5985);
            color: white;
            padding: 0.75rem 0.5rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid #2c3e50;
        }

        .template-preview-table td {
            padding: 0.5rem;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #6b7280;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="h-screen">
        <div id="sidebar-container"></div>

        <div class="flex-1 flex flex-col ml-14 overflow-auto custom-scrollbar h-screen">
            <main class="flex-1 overflow-y-auto p-4 bg-white border border-gray-300 rounded-tl-2xl">
                <!-- Header -->
                <div class="mb-2">
                    <div class="flex justify-between items-center">
                        <div class="pl-2 pt-2">
                            <h1 class="text-2xl font-bold text-[#2F3E46]">Manage Products</h1>
                            <p class="text-sm text-gray-600 mt-1">Manage products, devices, test types, parameters, and
                                templates</p>
                        </div>
                    </div>
                </div>

                <!-- Filter Section -->
                <div class="flex mb-2 justify-end gap-2">
                    <div class="flex justify-end items-center gap-2">
                        <label for="product_name" class="text-sm font-medium text-gray-900 whitespace-nowrap">
                            Search :
                        </label>

                        <input type="text" id="filter_product" placeholder="Search product, device, test type or number"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm
               rounded-lg focus:ring-blue-500 focus:border-blue-500
               w-64 px-3 py-2 shadow-sm" />
                    </div>

                    <div class="flex items-end">
                        <button type="button" title="Clear" onclick="resetFilters()"
                            class="inline-flex items-center py-2 px-2 cursor-pointer justify-center text-white bg-blue-400 hover:bg-blue-600 focus:ring-4 focus:ring-blue-300 shadow-sm rounded-lg focus:outline-none transition-colors duration-200">
                            <svg fill="#FFFFFF" class="w-6 h-6" viewBox="-7.5 0 32 32" version="1.1"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15.88 13.84c-1.68-3.48-5.44-5.24-9.040-4.6l0.96-1.8c0.24-0.4 0.080-0.92-0.32-1.12-0.4-0.24-0.92-0.080-1.12 0.32l-1.96 3.64c0 0-0.44 0.72 0.24 1.040l3.64 1.96c0.12 0.080 0.28 0.12 0.4 0.12 0.28 0 0.6-0.16 0.72-0.44 0.24-0.4 0.080-0.92-0.32-1.12l-1.88-1.040c2.84-0.48 5.8 0.96 7.12 3.68 1.6 3.32 0.2 7.32-3.12 8.88-1.6 0.76-3.4 0.88-5.080 0.28s-3.040-1.8-3.8-3.4c-0.76-1.6-0.88-3.4-0.28-5.080 0.16-0.44-0.080-0.92-0.52-1.080-0.4-0.080-0.88 0.16-1.040 0.6-0.72 2.12-0.6 4.36 0.36 6.36s2.64 3.52 4.76 4.28c0.92 0.32 1.84 0.48 2.76 0.48 1.24 0 2.48-0.28 3.6-0.84 4.16-2 5.92-7 3.92-11.12z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Product Table -->
                <div class="relative overflow-x-auto bg-gray-50 shadow-sm rounded-lg border border-gray-200">
                    <table class="w-full text-sm text-left text-gray-700">
                        <thead class="text-sm text-white bg-[#52796F] border-b rounded-lg border-gray-200 text-center">
                            <tr>
                                <th scope="col" class="px-6 py-3 font-medium">No.</th>
                                <th scope="col" class="px-6 py-3 font-medium">Product Name</th>
                                <th scope="col" class="px-6 py-3 font-medium">Device</th>
                                <th scope="col" class="px-6 py-3 font-medium">Test Type</th>
                                <th scope="col" class="px-6 py-3 font-medium">Parameters</th>
                                <th scope="col" class="px-6 py-3 font-medium">Templates</th>
                                <th scope="col" class="px-6 py-3 font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="text-center">
                            <!-- Table rows will be generated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- View Parameters Modal -->
    <div id="modalViewParameters" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="viewParametersTitle">Parameters</h3>
                <button class="btn-close"
                    onclick="document.getElementById('modalViewParameters').classList.remove('active')">&times;</button>
            </div>
            <div id="viewParametersContent"></div>
            <div class="mt-6 flex justify-end">
                <button class="btn-secondary"
                    onclick="document.getElementById('modalViewParameters').classList.remove('active')">Close</button>
            </div>
        </div>
    </div>

    <!-- View Template Modal -->
    <div id="modalViewTemplate" class="modal">
        <div class="modal-content modal-content-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="viewTemplateTitle">Template Preview</h3>
                <button class="btn-close"
                    onclick="document.getElementById('modalViewTemplate').classList.remove('active')">&times;</button>
            </div>
            <div id="viewTemplateContent"></div>
            <div class="mt-6 flex justify-end">
                <button class="btn-secondary"
                    onclick="document.getElementById('modalViewTemplate').classList.remove('active')">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div id="modalEdit" class="modal">
        <div class="modal-content modal-content-lg">
            <div class="modal-header">
                <h3 class="modal-title">Edit Product</h3>
                <button class="btn-close" onclick="cancelEdit()">&times;</button>
            </div>

            <!-- Tabs -->
            <div class="border-b border-gray-200 mb-4">
                <nav class="flex -mb-px">
                    <button id="tabProduct" onclick="switchEditTab('product')"
                        class="tab-btn active py-3 px-6 text-sm font-medium border-b-2 border-transparent hover:border-gray-300 transition-colors">
                        <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                        Product Details
                    </button>
                    <button id="tabParameters" onclick="switchEditTab('parameters')"
                        class="tab-btn py-3 px-6 text-sm font-medium border-b-2 border-transparent hover:border-gray-300 transition-colors">
                        <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Parameters
                    </button>
                    <button id="tabTemplate" onclick="switchEditTab('template')"
                        class="tab-btn py-3 px-6 text-sm font-medium border-b-2 border-transparent hover:border-gray-300 transition-colors">
                        <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Template
                    </button>
                </nav>
            </div>

            <!-- Tab Content -->
            <div class="min-h-[400px] max-h-[500px] overflow-y-auto">
                <div id="productContent" class="tab-content"></div>
                <div id="parametersContent" class="tab-content hidden"></div>
                <div id="templateContent" class="tab-content hidden"></div>
            </div>

            <!-- Footer Actions -->
            <div class="mt-6 pt-4 border-t border-gray-200 flex justify-end gap-3">
                <button class="btn-secondary" onclick="cancelEdit()">Cancel</button>
                <button class="btn-primary" onclick="saveEditChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="modalError" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="flex items-center mb-3">
                <div class="bg-red-100 p-2 rounded-full mr-3">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-800" id="errorTitle">Error</h3>
            </div>
            <p class="text-sm text-gray-600 mb-6" id="errorMessage"></p>
            <div class="flex justify-end">
                <button class="btn-danger" onclick="closeErrorModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="modalConfirm" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="flex items-center mb-3">
                <div class="bg-yellow-100 p-2 rounded-full mr-3">
                    <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3l-6.928-12c-.77-1.333-2.694-1.333-3.464 0L2.35 16c-.77 1.333.192 3 1.732 3z">
                        </path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-800" id="confirmTitle">Confirm Action</h3>
            </div>
            <p class="text-sm text-gray-600 mb-6" id="confirmMessage"></p>
            <div class="flex justify-end gap-3">
                <button class="btn-secondary" id="btnConfirmNo">Cancel</button>
                <button class="btn-danger" id="btnConfirmYes">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="modalSuccess" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="flex items-center mb-3">
                <div class="bg-green-100 p-2 rounded-full mr-3">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-gray-800">Success</h3>
            </div>
            <p class="text-sm text-gray-600 mb-6" id="successMessage"></p>
            <div class="flex justify-end">
                <button class="btn-primary" onclick="closeSuccessModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="../Assets/js/sidebar-loader.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            console.log("Manage Product page loaded, initializing sidebar...");
            await SidebarLoader.load("sidebar-container", "manage");

            if (window.electronAPI && window.electronAPI.onPageLoaded) {
                window.electronAPI.onPageLoaded((pageName) => {
                    console.log("Page changed to:", pageName);
                    SidebarLoader.setActivePage(pageName);
                });
            }
        });
    </script>
    <script src="../Assets/js/ManageProduct.js"></script>
</body>

</html>
