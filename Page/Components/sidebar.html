<!-- sidebar.html -->
<div
  class="fixed inset-y-0 left-0 z-40 flex flex-col items-center w-14 h-screen overflow-y-auto sidebar-scroll text-[#52796F] bg-gray-100 border-r border-gray-100"
  id="sidebar"
>
  <!-- Logo -->
  <div class="flex items-center justify-center mt-3 mb-1" title="Home">
    <svg
      class="w-8 h-8 fill-current text-[#354F52]"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path

      />

  <!-- Main Navigation -->
  <div

  >
    <!-- Dashboard Button -->
    <button
      class="sidebar-btn flex items-center justify-center w-12 h-12 mt-2 rounded-lg hover:bg-[#CAD2C5] transition-colors"
      data-page="dashboard"
      title="Dashboard"
    >
      <svg
        class="w-6 h-6 stroke-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
    </button>

    <!-- Menu Button -->
    <button
      class="sidebar-btn flex items-center justify-center w-12 h-12 mt-2 rounded-lg hover:bg-[#CAD2C5] transition-colors"
      data-page="menu"
      title="Menu"
    >
      <svg
        class="w-6 h-6 stroke-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"
        />

    </button>

    <!-- View Button -->
    <button
      class="sidebar-btn flex items-center justify-center w-12 h-12 mt-2 rounded-lg hover:bg-[#CAD2C5] transition-colors"
      data-page="view"
      title="View"
    >
      <svg
        class="w-6 h-6 stroke-current"
        viewBox="0 0 24.00 24.00"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="3.5" stroke="currentColor"></circle>
        <path
          d="M21 12C21 12 20 4 12 4C4 4 3 12 3 12"
          stroke="currentColor"
        ></path>
      </svg>
    </button>

    <!-- About Button -->
    <button
      class="sidebar-btn flex items-center justify-center w-12 h-12 mt-2 rounded-lg hover:bg-[#CAD2C5] transition-colors"
      data-page="about"
      title="About"
    >
      <svg
        class="w-6 h-6 stroke-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    </button>
  </div>

  <!-- Account -->
  <a
    href="#"
    class="flex items-center justify-center w-16 h-16 mt-auto bg-[#CAD2C5] hover:bg-[#dad7cd] transition-colors border-t border-gray-300"
    title="My Account"
  >
    <svg
      class="w-6 h-6 stroke-current text-[#52796F]"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
  </a>
</div>

<style>
  .sidebar-btn.active {
    background-color: #dad7cd !important;
    color: #2f3e46 !important;
  }

  .sidebar-btn {
    transition: all 0.2s ease;
    cursor: pointer;
    border: none;
    outline: none;
  }

  .sidebar-btn:focus {
    outline: 2px solid #354f52;
    outline-offset: 2px;
  }

  /* Scrollbar */
  .sidebar-scroll {
    overflow-x: hidden;
  }

  .sidebar-scroll::-webkit-scrollbar {
    width: 4px;
  }

  .sidebar-scroll::-webkit-scrollbar-track {
    background: #f1f5f9;
  }

  .sidebar-scroll::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 2px;
  }

  .sidebar-scroll::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  .sidebar-scroll > * {
    max-width: 100%;
    box-sizing: border-box;
  }
</style>
