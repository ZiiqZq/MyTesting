<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry - Testing System</title>
  <link rel="stylesheet" href="../Assets/css/css.css">
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    
    /* Animasi */
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* Table styling */
    .data-entry-table th, .data-entry-table td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: center;
    }
    .data-entry-table input, .data-entry-table select {
      width: 100%;
      padding: 4px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
    .data-entry-table input:focus, .data-entry-table select:focus {
      outline: none;
      border-color: #3b82f6;
      ring: 2px;
      ring-color: #3b82f6;
    }
    
    /* Status indicators */
    .status-pass { background-color: #dcfce7; color: #166534; font-weight: 600; }
    .status-fail { background-color: #fee2e2; color: #991b1b; font-weight: 600; }
    .status-empty { background-color: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  
  <!-- Header -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Data Entry Testing</h1>
        <p class="text-sm text-gray-600">Input test results for products</p>
      </div>
      <button onclick="goBack()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
        ← Kembali ke Dashboard
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Step 1: Select Product -->
    <div id="step1-select-product" class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-800">Step 1: Pilih Produk</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Produk</label>
          <select id="productSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="">-- Pilih Produk --</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="loadTestTypes()" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
            Lanjut →
          </button>
        </div>
      </div>
    </div>

    <!-- Step 2: Select Test Type -->
    <div id="step2-select-test" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4 text-gray-800">Step 2: Pilih Jenis Test</h2>
      <div id="testTypeList" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Test type buttons akan dimuat di sini -->
      </div>
    </div>

    <!-- Step 3: Input Modal (Operator Info) -->
    <div id="modalOperatorInfo" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md fade-in">
        <h3 class="text-xl font-semibold mb-4 text-gray-800">Informasi Test</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nama Operator (Singkatan)</label>
            <input type="text" id="operatorName" placeholder="Contoh: JD, SM" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">PO Number</label>
            <input type="text" id="poNumber" placeholder="Contoh: PO-2024-001" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Serial Number Awal</label>
            <input type="text" id="startSerial" placeholder="Contoh: 123456" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Jumlah (+)</label>
            <input type="number" id="quantity" min="1" max="100" value="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button onclick="closeOperatorModal()" class="flex-1 px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
            Batal
          </button>
          <button onclick="generateDataEntryTable()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Generate Table
          </button>
        </div>
      </div>
    </div>

    <!-- Step 4: Data Entry Table -->
    <div id="step4-data-entry" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Step 3: Input Data</h2>
        <div class="text-sm text-gray-600">
          <span id="testInfo"></span>
        </div>
      </div>
      
      <!-- Table Container dengan Scroll -->
      <div class="overflow-x-auto mb-4" style="max-height: 500px;">
        <table id="dataEntryTable" class="data-entry-table w-full bg-white border-collapse text-sm">
          <!-- Header dan Body akan di-generate oleh JS -->
        </table>
      </div>

      <!-- Summary -->
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
        <div class="flex justify-between items-center">
          <div>
            <span class="font-semibold text-gray-700">Total:</span>
            <span id="totalCount" class="ml-2">0</span>
          </div>
          <div>
            <span class="font-semibold text-green-700">Pass:</span>
            <span id="passCount" class="ml-2">0</span>
          </div>
          <div>
            <span class="font-semibold text-red-700">Fail:</span>
            <span id="failCount" class="ml-2">0</span>
          </div>
          <div>
            <span class="font-semibold text-gray-700">Empty:</span>
            <span id="emptyCount" class="ml-2">0</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button onclick="resetDataEntry()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
          Reset
        </button>
        <button onclick="submitDataEntry()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
          Submit Data
        </button>
      </div>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in">
    <p id="toastMessage"></p>
  </div>

  <script src="../Assets/js/first.js"></script>
</body>
</html>
